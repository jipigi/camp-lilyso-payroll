[project]
name = "camp-lilyso-payroll"
version = "0.1.0"
description = "Moteur de paie interne du Camp LilySO — reproduction locale des calculs WebRAS et ARC pour salariés saisonniers au Québec."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Proprietary — usage interne Camp LilySO" }
authors = [
    { name = "Camp LilySO" }
]
keywords = ["paie", "quebec", "webras", "arc", "obnl"]

dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
ui = [
    "streamlit>=1.36",
]
pdf = [
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Couverture minimale : la barre monte à mesure que les modules du domaine
    # sont implémentés (voir tasks 2 à 12). Aucun paramètre fiscal ni valeur en
    # dur ne doit être introduit dans le code pour satisfaire la couverture.
    "--cov=models",
    "--cov=payroll_engine",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
testpaths = ["tests"]
markers = [
    "golden: golden tests reproduisant WebRAS ou PDOC au cent près",
    "property: property-based tests (Hypothesis) pour les invariants du domaine",
    "unsupported: tests vérifiant qu'un cas hors matrice lève UnsupportedPayrollCase",
]

[tool.coverage.run]
branch = true
source = ["models", "payroll_engine"]

[tool.coverage.report]
# Refuser tout `# pragma: no cover` non justifié : la traçabilité (règle 02)
# implique que chaque branche du domaine paie soit soit couverte, soit
# explicitement documentée. La liste ci-dessous reste vide par défaut.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payroll_engine", "models", "app"]
